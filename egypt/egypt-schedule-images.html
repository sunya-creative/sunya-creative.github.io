<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이집트 신 · 파라오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:#1b1b1b;padding:20px 14px 50px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  .header{width:100%;max-width:780px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .section-header{width:100%;max-width:780px;display:flex;justify-content:flex-start;align-items:center;margin-top:28px;margin-bottom:16px}
  h1, h2{font-size:15px;font-weight:700;line-height:1.2}
  .back-btn{color:#333;background:#f7f7f7;border:1px solid #e0e0e0;padding:6px 12px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:500;transition:all .15s}
  .back-btn:hover{background:#ebebeb;color:#111}
  .img-container{display:flex;flex-direction:column;gap:16px;width:100%;max-width:780px;align-items:center}
  img{width:100%;max-width:780px;height:auto;display:block}
</style>
</head>
<body>
  <div class="header">
    <h1>이집트 신</h1>
    <a href="./index.html" class="back-btn">← 연표로 돌아가기</a>
  </div>
  <div class="img-container">
    <img src="./egypt-gods-1.png" alt="이집트 신 이미지 1">
    <img src="./egypt-gods-2.png" alt="이집트 신 이미지 2">
  </div>

  <div class="section-header">
    <h2>이집트 파라오</h2>
  </div>
  <div class="img-container">
    <img src="./Pharaoh.png" alt="이집트 파라오">
  </div>
</body>
</html>
